[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NOTE: /api/* routing is handled by public/_redirects (higher priority).
# That file routes /api/* → /.netlify/functions/api/:splat before the SPA fallback.

# SPA fallback for React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

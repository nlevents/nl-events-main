[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NOTE: all routing (API, missing-asset 404, SPA fallback) lives in
# public/_redirects, which Netlify evaluates before this file. Caching headers
# live in public/_headers. Keep them there so there is a single source of truth.

# Safety-net SPA fallback (only reached if public/_redirects is not deployed).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

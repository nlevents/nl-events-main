  @keyframes nle-spin{ to{ transform:rotate(360deg); } }

<script>
(function(){
  var loader = document.getElementById('nle-loader');
  if (!loader) return;
  var isHome = location.pathname === '/';
  var MIN_MS = 350;   // avoid a flash-of-loader on fast connections
  var MAX_MS = 4000;  // never block the site longer than this, whatever fails
  var start = Date.now();
  var hidden = false;
  var appReady = false;
  var imageReady = !isHome; // only the homepage needs the hero image ready

  function tryHide(){
    if (hidden || !appReady || !imageReady) return;
    hidden = true;
    var wait = Math.max(0, MIN_MS - (Date.now() - start));
    setTimeout(function(){
      loader.classList.add('nle-loader-hide');
      setTimeout(function(){ if (loader.parentNode) loader.parentNode.removeChild(loader); }, 500);
    }, wait);
  }

  // Dispatched by usePageMeta once the actual page component has mounted —
  // see src/hooks/usePageMeta.js.
  window.addEventListener('nle:app-ready', function(){ appReady = true; tryHide(); }, { once: true });

  if (isHome) {
    var heroImg = new Image();
    heroImg.onload = heroImg.onerror = function(){ imageReady = true; tryHide(); };
    heroImg.src = "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80";
  }

  // Safety net: something failed to fire (slow network, blocked request,
  // JS error) — reveal the site anyway rather than leaving it hidden.
  setTimeout(function(){ appReady = true; imageReady = true; tryHide(); }, MAX_MS);
})();
</script>
